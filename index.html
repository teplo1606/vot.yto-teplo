<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вот.Это-ТЕПЛО — красивое приглашение на свидание</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #f3e6d6;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(255,180,120,.18), transparent 60%),
        radial-gradient(ellipse at 50% 100%, rgba(120,20,60,.5), transparent 70%),
        linear-gradient(180deg, #2a0710 0%, #4a1226 45%, #6b1a35 100%);
      background-attachment: fixed;
      overflow-x: hidden;
    }
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.55) 100%);
      z-index: 0;
    }

    .decor {
      position: fixed;
      pointer-events: none;
      z-index: 0;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,.3));
    }
    .decor--tl { top: -10px; left: -10px; width: 320px; height: 320px; }
    .decor--tr { top: -10px; right: -10px; width: 320px; height: 320px; transform: scaleX(-1); }
    .decor--chandelier { top: 0; left: 50%; transform: translateX(-50%); width: 180px; height: 300px; }
    .decor--bl { bottom: 0; left: 0; width: 300px; height: 200px; }
    .decor--br { bottom: 0; right: 0; width: 300px; height: 200px; transform: scaleX(-1); }
    body.landing-mode .decor--chandelier { display: none; }

    button {
      padding: 13px 20px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #b8874a 0%, #d4a574 100%);
      color: #fff;
      font: inherit;
      font-weight: 600;
      letter-spacing: .5px;
      cursor: pointer;
      transition: transform .15s, box-shadow .2s;
      box-shadow: 0 6px 20px rgba(184,135,74,.4);
      position: relative;
      z-index: 10;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    button:hover { box-shadow: 0 8px 24px rgba(184,135,74,.55); }
    button:active { transform: translateY(1px); }
    button.secondary {
      background: transparent;
      color: #6b3a4a;
      border: 1px solid #d4a574;
      box-shadow: none;
    }
    button.secondary:hover { background: rgba(212,165,116,.1); }

    /* ====== ЛЕНДИНГ ====== */
    .landing { position: relative; z-index: 1; }
    .landing h1, .landing h2 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 600;
      color: #fff4e3;
      letter-spacing: .5px;
      margin: 0;
    }
    .nav {
      position: sticky; top: 0;
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 28px;
      background: rgba(42, 7, 16, .7);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(212, 165, 116, .2);
      z-index: 20;
    }
    .brand {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 22px; color: #d4a574; font-weight: 600;
    }
    .nav-cta {
      padding: 10px 20px;
      background: linear-gradient(135deg, #b8874a, #d4a574);
      border-radius: 10px; color: #fff; border: 0;
      font: inherit; font-weight: 600; font-size: 14px; cursor: pointer;
      box-shadow: 0 6px 20px rgba(184,135,74,.4);
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .hero {
      min-height: 78vh; display: grid; place-items: center;
      text-align: center; padding: 80px 24px 60px; position: relative;
    }
    .hero-inner { max-width: 680px; }
    .kicker {
      text-transform: uppercase; letter-spacing: 5px; font-size: 11px;
      color: #d4a574; margin: 0 0 24px; font-weight: 600;
    }
    .hero h1 { font-size: 58px; line-height: 1.05; margin: 0 0 24px; }
    .hero h1 em { font-style: italic; color: #f5b8cf; }
    .lead {
      font-size: 18px; color: rgba(243, 230, 214, .8);
      line-height: 1.6; margin: 0 0 36px;
    }
    .btn-big { padding: 16px 34px; font-size: 16px; }
    .hero-note {
      margin: 16px 0 0; color: #f5b8cf;
      font-size: 14px; letter-spacing: 1px; font-weight: 600;
    }
    .section { max-width: 1100px; margin: 0 auto; padding: 80px 24px; }
    .section h2 { text-align: center; font-size: 42px; margin: 0 0 12px; }
    .section .sub {
      text-align: center; color: rgba(243, 230, 214, .6);
      margin: 0 0 48px; font-size: 15px;
    }
    .features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
    }
    .feature {
      padding: 28px 24px;
      background: rgba(255, 250, 241, .05);
      border: 1px solid rgba(212, 165, 116, .2);
      border-radius: 18px; backdrop-filter: blur(10px);
      transition: border-color .2s, transform .2s;
    }
    .feature:hover { border-color: rgba(212, 165, 116, .5); transform: translateY(-2px); }
    .feature-icon { font-size: 32px; margin-bottom: 14px; display: block; line-height: 1; }
    .feature h3 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      color: #d4a574; font-size: 22px; font-weight: 600; margin: 0 0 8px;
    }
    .feature p { color: rgba(243, 230, 214, .7); font-size: 14px; line-height: 1.55; margin: 0; }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 24px;
    }
    .preview {
      border-radius: 20px; overflow: hidden;
      background: rgba(255, 250, 241, .05);
      border: 1px solid rgba(212, 165, 116, .2);
      transition: transform .25s, border-color .25s;
    }
    .preview:hover { transform: translateY(-4px); border-color: rgba(212, 165, 116, .5); }
    .preview svg { width: 100%; display: block; aspect-ratio: 3 / 2; }
    .preview-caption {
      padding: 16px 20px; display: flex;
      justify-content: space-between; align-items: center; gap: 8px;
    }
    .preview-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 20px; color: #d4a574; font-weight: 600;
    }
    .preview-tag {
      font-size: 11px; text-transform: uppercase;
      letter-spacing: 1.5px; color: rgba(243, 230, 214, .5);
    }
    .cta-bottom {
      text-align: center; padding: 90px 24px;
      background: rgba(0, 0, 0, .25);
      border-top: 1px solid rgba(212, 165, 116, .15);
      border-bottom: 1px solid rgba(212, 165, 116, .15);
    }
    .cta-bottom h2 { font-size: 44px; margin: 0 0 16px; }
    .cta-bottom p {
      color: rgba(243, 230, 214, .7); font-size: 16px;
      margin: 0 auto 32px; max-width: 480px; line-height: 1.6;
    }
    .footer { padding: 60px 24px 40px; text-align: center; }
    .footer-brand {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 26px; color: #d4a574; margin-bottom: 8px; font-weight: 600;
    }
    .footer-tag { color: rgba(243, 230, 214, .5); font-size: 14px; margin: 0 0 28px; }
    
    .socials { display: flex; justify-content: center; gap: 12px; margin-bottom: 28px; flex-wrap: wrap; }
    .socials a {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 18px;
      border: 1px solid rgba(212, 165, 116, .3);
      border-radius: 10px; color: #f3e6d6; text-decoration: none;
      font-size: 14px; transition: all .2s;
    }
    .socials a:hover { background: rgba(212, 165, 116, .15); border-color: #d4a574; color: #fff; }
    .socials svg { width: 18px; height: 18px; }
    
    .req-box {
      margin: 30px auto;
      max-width: 600px;
      background: rgba(0,0,0,0.2);
      border: 1px solid rgba(212, 165, 116, 0.2);
      border-radius: 12px;
      padding: 20px;
      text-align: left;
      font-size: 12px;
      color: rgba(243, 230, 214, 0.7);
      line-height: 1.6;
    }
    .req-box h4 {
      margin: 0 0 12px;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 18px;
      color: #d4a574;
      text-align: center;
      letter-spacing: 0.5px;
    }
    .req-box p { margin: 0 0 4px; }
    .req-box b { color: rgba(243, 230, 214, 0.9); }
    
    .copyright { color: rgba(243, 230, 214, .35); font-size: 12px; margin: 0; }

    /* ====== КАРТОЧКИ ====== */
    .centered-view {
      position: relative; z-index: 1; min-height: 100vh;
      min-height: 100dvh;
      display: flex; flex-direction: column;
      padding: 40px 20px;
    }
    .card {
      margin: auto;
      width: 100%; max-width: 520px;
      background: linear-gradient(180deg, #fffaf1 0%, #fff4e3 100%);
      border-radius: 28px; padding: 38px 34px;
      color: #3a1526; position: relative; border: 1px solid #d4a574;
      box-shadow:
        0 40px 100px rgba(0,0,0,.6),
        0 0 60px rgba(255,180,120,.15),
        inset 0 1px 0 rgba(255,255,255,.8);
      animation: cardIn .6s ease;
    }
    .card::before {
      content: ''; position: absolute; inset: 9px;
      border: 1px solid rgba(184,135,74,.35);
      border-radius: 20px; pointer-events: none;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(12px) scale(.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .back-link {
      display: inline-block; margin-bottom: 20px;
      color: #8a6a5a; font-size: 13px; text-decoration: none;
      cursor: pointer; transition: color .2s;
    }
    .back-link:hover { color: #b8874a; }
    .card h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 600; font-size: 32px; line-height: 1.15;
      margin: 0 0 6px; color: #4a1a2c; text-align: center;
    }
    .step-title {
      color: #8a6a5a; font-size: 12px; letter-spacing: 2px;
      text-transform: uppercase; margin: 0 0 22px; text-align: center;
    }
    .card label {
      display: block; margin: 14px 0 6px; font-weight: 600;
      font-size: 12px; color: #6b3a4a; letter-spacing: .5px;
      text-transform: uppercase;
    }
    .card input, .card textarea {
      width: 100%; padding: 12px 14px;
      border: 1px solid #e6d0b8; border-radius: 12px;
      font: inherit; color: #3a1526;
      background: rgba(255,255,255,.75);
      transition: border-color .2s, box-shadow .2s;
      font-size: 16px;
    }
    .card input:focus, .card textarea:focus {
      outline: none; border-color: #b8874a;
      box-shadow: 0 0 0 3px rgba(184,135,74,.15);
    }
    .card textarea { min-height: 90px; resize: vertical; }
    .card .actions { display: flex; gap: 10px; margin-top: 22px; position: relative; z-index: 20; }
    .card .actions button { flex: 1; margin-top: 0; }
    .card .row { display: flex; gap: 8px; margin-top: 12px; }
    .card .row input { flex: 1; }
    .card .row button { margin-top: 0; white-space: nowrap; }
    .hint {
      color: #8a6a5a; margin: 0 0 14px; text-align: center;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic; font-size: 17px;
    }
    .msg { white-space: pre-wrap; line-height: 1.55; color: #4a1a2c; }
    .answer {
      margin-top: 20px; padding: 18px; border-radius: 16px;
      background: linear-gradient(135deg, rgba(212,165,116,.12), rgba(232,90,128,.08));
      border: 1px solid rgba(212,165,116,.3);
    }
    .small { color: #8a6a5a; font-size: 12px; }
    .progress { display: flex; gap: 6px; margin-bottom: 22px; }
    .progress span {
      flex: 1; height: 5px; border-radius: 3px;
      background: #e6d0b8; transition: background .3s;
    }
    .progress span.active { background: #b8874a; }
    .progress span.done { background: #d4a574; }
    .step { animation: fade .3s ease; }
    @keyframes fade {
      from { opacity: 0; transform: translateX(10px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    /* ====== ВЫБОР СМАЙЛИКА ====== */
    .sticker-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .sticker-card {
      aspect-ratio: 1;
      background: #ffffff;
      border: 2px solid #e6d0b8;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 6px;
      transition: all .2s;
      position: relative;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .sticker-card:hover { border-color: #d4a574; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.05); }
    .sticker-card.active { border-color: #e11d48; background: #fff5f7; box-shadow: 0 0 0 1px #e11d48; }
    .sticker-card svg { width: 100%; height: 100%; object-fit: contain; }

    /* ====== АНИМАЦИЯ КНОПОК ====== */
    .anim-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 10px;
    }
    @media (max-width: 520px) {
      .anim-grid { grid-template-columns: 1fr; gap: 20px; }
    }
    .anim-col h3 {
      font-size: 12px; text-transform: uppercase; color: #8a6a5a;
      margin: 0 0 10px; font-weight: 600; letter-spacing: .5px;
    }
    .anim-option {
      padding: 12px 14px;
      border: 1px solid #e6d0b8;
      border-radius: 12px;
      margin-bottom: 8px;
      cursor: pointer;
      font-size: 14px;
      color: #4a1a2c;
      background: rgba(255,255,255,.6);
      transition: all .2s;
      display: flex;
      align-items: center;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .anim-option:hover { border-color: #d4a574; background: #fff; }
    .anim-option.active {
      border-color: #b8874a; background: #fffaf1;
      box-shadow: 0 0 0 2px rgba(184,135,74,.15);
      font-weight: 600;
    }
    .anim-option.active::before {
      content: '✓'; color: #b8874a; margin-right: 8px; font-weight: bold;
    }
    .anim-preview-box {
      background: #fdfaf6;
      border: 1px solid #f0e6d8;
      border-radius: 16px;
      padding: 24px;
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 120px;
      position: relative;
      overflow: hidden;
      width: 100%;
    }
    .anim-preview-btn {
      background: #d4a574; color: #fff; border-radius: 20px;
      padding: 8px 32px; font-weight: 600; font-size: 14px;
      pointer-events: none; transition: all .2s;
      width: 100%; max-width: 200px;
      position: relative;
    }

    /* Эффекты анимаций */
    @keyframes shakeEffect {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    @keyframes explodeEffect {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.5); opacity: 0.8; }
      100% { transform: scale(2); opacity: 0; }
    }
    @keyframes shrinkEffect {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(0.5); opacity: 0.3; }
    }
    @keyframes floatKiss {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-50px) scale(1.5); opacity: 0; }
    }

    /* ====== ВЫБОР МЕСТА И ЕДЫ ====== */
    .choice-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(75px, 1fr));
      gap: 8px;
      margin-bottom: 16px;
    }
    .choice-btn {
      background: #ffffff;
      border: 1px solid #e6d0b8;
      border-radius: 12px;
      padding: 10px 6px;
      text-align: center;
      cursor: pointer;
      transition: all .2s;
      font-size: 12px;
      font-weight: 500;
      color: #4a1a2c;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .choice-btn .icon {
      font-size: 22px;
      margin-bottom: 4px;
      line-height: 1;
    }
    .choice-btn:hover { border-color: #d4a574; background: #fff; }
    .choice-btn.active {
      border-color: #b8874a; background: #fffaf1;
      box-shadow: 0 0 0 2px rgba(184,135,74,.15);
      font-weight: 600;
    }

    /* ====== ТЕКСТЫ ЭКРАНА ====== */
    .char-counter {
      text-align: right;
      font-size: 11px;
      color: #8a6a5a;
      margin-top: 4px;
      margin-bottom: 14px;
      font-family: monospace;
    }

    /* ====== ОПЛАТА ЮMONEY ====== */
    .ymoney-box {
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }
    .ymoney-logo {
      font-family: 'Inter', sans-serif;
      font-weight: 800;
      font-size: 24px;
      color: #8b3ffd;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    .ymoney-logo span { color: #000; }
    .ymoney-price {
      font-size: 36px;
      font-weight: 700;
      color: #3a1526;
      margin: 10px 0;
    }
    .ymoney-btn {
      display: block;
      width: 100%;
      padding: 16px;
      background: #8b3ffd;
      color: #fff;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 16px;
      transition: background 0.2s;
      box-shadow: 0 4px 15px rgba(139, 63, 253, 0.3);
      margin-top: 16px;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .ymoney-btn:hover { background: #732be0; }

    /* ====== РЕЖИМЫ / ЦВЕТА ====== */
    .mode-tabs {
      display: flex; gap: 4px; margin-bottom: 22px;
      background: rgba(230, 208, 184, .45);
      padding: 4px; border-radius: 14px;
    }
    .mode-tab {
      flex: 1; padding: 10px 6px; border: 0;
      background: transparent !important;
      border-radius: 10px; color: #8a6a5a; cursor: pointer;
      font: inherit; font-size: 11px; font-weight: 600;
      margin: 0 !important; box-shadow: none !important;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
      transition: background .2s, color .2s;
      line-height: 1.2;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .mode-tab span:first-child { font-size: 18px; }
    .mode-tab.active {
      background: #fffaf1 !important; color: #4a1a2c;
      box-shadow: 0 2px 8px rgba(184,135,74,.25) !important;
    }
    .mode-tab:hover:not(.active) { background: rgba(255,255,255,.5) !important; }

    .swatches { display: flex; gap: 10px; flex-wrap: wrap; margin: 8px 0 4px; }
    .swatch {
      width: 40px !important; height: 40px;
      border-radius: 50% !important;
      border: 2px solid transparent !important;
      cursor: pointer; padding: 0 !important; margin: 0 !important;
      box-shadow: 0 2px 6px rgba(0,0,0,.18) !important;
      transition: transform .15s, border-color .15s;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .swatch:hover { transform: scale(1.1); }
    .swatch.active {
      border-color: #b8874a !important;
      box-shadow: 0 0 0 3px rgba(184,135,74,.3), 0 2px 6px rgba(0,0,0,.18) !important;
    }

    /* ====== ЭКРАН КОДА ====== */
    .lock-icon { display: flex; justify-content: center; margin-bottom: 18px; }
    .code-input {
      width: 100%; padding: 16px 14px !important;
      font-size: 30px !important; text-align: center !important;
      letter-spacing: 10px !important;
      font-family: 'Cormorant Garamond', Georgia, serif !important;
      font-weight: 600 !important; color: #4a1a2c !important;
    }
    .error-msg {
      color: #c93e6b; font-size: 14px; text-align: center;
      margin-top: 12px; min-height: 20px; opacity: 0;
      transition: opacity .2s;
    }
    .error-msg.show { opacity: 1; }
    .hint-note {
      margin-top: 16px; padding: 12px 14px;
      background: rgba(212,165,116,.1);
      border: 1px dashed rgba(212,165,116,.4);
      border-radius: 12px; color: #6b3a4a;
      font-size: 14px; text-align: center; font-style: italic;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .shake { animation: shake .4s ease; border-color: #e11d48 !important; }

    /* ====== КОНВЕРТ ====== */
    .envelope-wrapper {
      width: 100%; max-width: 280px;
      height: 190px;
      margin: 30px auto 10px;
      perspective: 1000px;
      cursor: pointer;
      position: relative;
      z-index: 10;
    }
    .env {
      width: 100%; height: 100%;
      position: relative;
      transform-style: preserve-3d;
    }
    .env-back {
      position: absolute; inset: 0;
      background: #d4a574;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,.15);
    }
    .env-letter {
      position: absolute;

      border-radius: 4px;
      z-index: 1;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);

      align-items: center;

      text-align: center;

      margin: 0 0 6px; font-size: 20px;
    }
    .env-flap {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 0;
      border-left: 140px solid transparent;
      border-right: 140px solid transparent;
      border-top: 100px solid #b8874a;
      transform-origin: top;
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 3;
      border-radius: 8px 8px 0 0;
    }
    .env-front {
      position: absolute; inset: 0;
      background: #d4a574;
      clip-path: polygon(0 0, 50% 50%, 100% 0, 100% 100%, 0 100%);
      z-index: 2;
      border-radius: 8px;
    }
    .env-seal {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 48px; height: 48px;
      background: radial-gradient(circle at 30% 30%, #e85a80, #7a1634);
      border-radius: 50%;
      z-index: 4;
      box-shadow: 0 4px 10px rgba(0,0,0,.4), inset 0 2px 4px rgba(255,255,255,.4);
      transition: opacity 0.3s, transform 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.8);
      font-size: 20px;
      font-weight: bold;
    }

          ? `<textarea name="${f.name}" placeholder="${esc(f.placeholder || '')}">${esc(val)}</textarea>`
          : `<input name="${f.name}" value="${esc(val)}" placeholder="${esc(f.placeholder || '')}" ${f.required ? 'required' : ''} ${f.maxLength ? `maxlength="${f.maxLength}"` : ''}>`;

          <form id="stepForm" onsubmit="event.preventDefault();">

            ${fieldsHtml}
            <div class="actions">

      const pNo = document.getElementById('previewNo');

        pYes.onclick = () => {
          const anim = state.data.animYes || 'kiss';
          if (anim === 'shake') {
            pYes.style.animation = 'none';
            void pYes.offsetWidth;
            pYes.style.animation = 'shakeEffect 0.5s ease-in-out, explodeEffect 0.5s 0.5s forwards';
            setTimeout(() => { pYes.style.animation = 'none'; pYes.style.opacity = 1; }, 1000);
          } else if (anim === 'kiss') {
             const kiss = document.createElement('div');
             kiss.textContent = '💋';
             kiss.style.cssText = 'position:absolute; left:50%; top:50%; font-size:24px; pointer-events:none; animation: floatKiss 0.8s ease-out forwards; z-index:10;';
             pYes.parentElement.appendChild(kiss);
             setTimeout(() => kiss.remove(), 800);
          }

      }
      if (pNo) {
        pNo.onclick = () => {
          const anim = state.data.animNo || 'shrink';
          if (anim === 'shrink') {
            pNo.style.animation = 'none';
            void pNo.offsetWidth;
            pNo.style.animation = 'shrinkEffect 0.5s forwards';
            setTimeout(() => { pNo.style.animation = 'none'; pNo.style.opacity = 1; pNo.style.transform = 'scale(1)'; }, 1000);
          }

      }

      // Логика для выбора места
      const placeBtns = document.querySelectorAll('#placeGrid .choice-btn');
      if (placeBtns.length) {
        placeBtns.forEach(btn => {
          btn.onclick = () => {
            placeBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            state.data.place = btn.dataset.val;
            
            const foodSec = document.getElementById('foodSection');
            const homeSec = document.getElementById('homeActsSection');

            if (state.data.place === 'Ресторан') {
              foodSec.style.display = 'block';
              homeSec.style.display = 'none';
              state.data.homeActs = [];
            } else if (state.data.place === 'Свидание дома') {
              foodSec.style.display = 'block';
              homeSec.style.display = 'block';
            } else {

              homeSec.style.display = 'none';

              state.data.homeActs = [];
              document.querySelectorAll('#foodGrid .choice-btn').forEach(b => b.classList.remove('active'));
              document.querySelectorAll('#homeActsGrid .choice-btn').forEach(b => b.classList.remove('active'));

      }

      // Логика для выбора еды (мультивыбор)

      if (foodBtns.length) {
        foodBtns.forEach(btn => {
          btn.onclick = () => {
            const val = btn.dataset.val;
            let current = state.data.food || [];
            
            if (current.includes(val)) {
              current = current.filter(item => item !== val);
              btn.classList.remove('active');
            } else {
              current.push(val);
              btn.classList.add('active');
            }
            state.data.food = current;
          };

      // Логика для выбора занятий дома (мультивыбор)

      const payBtn = document.getElementById('payBtn');
      if (payBtn) {
        payBtn.onclick = () => {

            localStorage.setItem('pending_payment', JSON.stringify(state.data));
            sessionStorage.setItem('pending_payment', JSON.stringify(state.data));

        };
      }

      // Ручное подтверждение оплаты
      const manualConfirm = document.getElementById('manualConfirm');

          e.preventDefault();
          showResult();

      // ОБРАБОТЧИК КНОПКИ "ДАЛЕЕ"
      const nextBtn = document.getElementById('nextBtn');
      if (nextBtn) {
        nextBtn.addEventListener('click', (e) => {
          e.preventDefault();
          
          const form = document.getElementById('stepForm');
          const fd = new FormData(form);
          for (const [k, v] of fd.entries()) state.data[k] = String(v).trim();

          // Валидация кастомного вопроса (шаг 4)
          const qInput = form.querySelector('[name="q"]');
          if (qInput && qInput.hasAttribute('required') && !qInput.value.trim()) {
             alert('Пожалуйста, заполните вопрос');
             return;
          }

          for (const f of fields) {
            const v = state.data[f.name];
            if (f.required && !v) { alert(`Заполни поле «${f.label}»`); return; }
            if (f.minLength && v && v.length < f.minLength) {
              alert(`«${f.label}» должно быть не короче ${f.minLength} символов`);
              return;
            }
          }

          if (stepIndex === 2) {
            if (state.data.mode === 'code') {
              delete state.data.scColor; delete state.data.scText; delete state.data.envText;
            } else if (state.data.mode === 'scratch') {
              delete state.data.code; delete state.data.hint; delete state.data.envText;
            } else {
              delete state.data.code; delete state.data.hint; delete state.data.scColor; delete state.data.scText;
            }
          }

          if (isLast) {
            showResult();
          } else { 
            state.step++; 
            drawStep(); 
          }
        });
      }
    }

    function showResult() {
      const raw = { ...state.data };
      const mode = raw.mode || 'code';
      delete raw.mode;

      if (mode === 'code') {
        raw.k = b64enc(raw.code);
        delete raw.code;
      } else if (mode === 'scratch') {
        raw.sc = '1';
      } else {
        raw.env = '1';
      }

      if (Array.isArray(raw.food) && raw.food.length > 0) {
        raw.food = raw.food.join(',');
      } else {
        delete raw.food;
      }

      if (Array.isArray(raw.homeActs) && raw.homeActs.length > 0) {
        raw.homeActs = raw.homeActs.join(',');
      } else {
        delete raw.homeActs;
      }

      if (!raw.place) delete raw.place;
      if (!raw.placeDetail) delete raw.placeDetail;

      const cleaned = {};
      Object.entries(raw).forEach(([k, v]) => { if (v !== '' && v != null) cleaned[k] = v; });
      const qs = new URLSearchParams(cleaned).toString();
      const url = location.origin + location.pathname + '?' + qs;

      // Очищаем URL от ?paid=true, чтобы не сломать копирование ссылки
      window.history.replaceState({}, document.title, location.pathname);

      document.getElementById('stepBody').innerHTML = `
        <div class="step">
          <h1>Оплачено 🌹</h1>
          <p class="step-title">Спасибо за доверие!</p>
          <div class="row">
            <input id="link" readonly value="${esc(url)}">
            <button id="copy" type="button">Копировать</button>
          </div>
          <p class="small" style="margin-top:14px;text-align:center">Ваше приглашение готово! Отправьте эту ссылку получателю.</p>
          <div class="actions">
            <button type="button" class="secondary" id="restart">Создать ещё</button>
            <button type="button" id="open">Открыть</button>
          </div>
        </div>`;
      drawProgress();

      document.getElementById('copy').onclick = async () => {
        await navigator.clipboard.writeText(url);
        document.getElementById('copy').textContent = 'Скопировано';
      };
      document.getElementById('open').onclick = () => location.href = url;
      document.getElementById('restart').onclick = () => {
        state.step = 0; state.data = {}; renderCreate();
      };
    }

    /* ====== СТИРАЕМАЯ КАРТИНКА ====== */
    function renderScratch() {
      document.body.classList.remove('landing-mode');
      const color = params.get('scColor') || '#d4a574';
      const text = params.get('scText') || 'Сотри меня 💌';

      renderInvite();

      const card = document.querySelector('.card');
      card.style.animation = 'none';

      const canvas = document.createElement('canvas');
      Object.assign(canvas.style, {
        position: 'absolute',
        top: '0', left: '0',
        width: '100%', height: '100%',
        borderRadius: '28px',
        cursor: 'grab',
        touchAction: 'none',
        zIndex: '10'
      });
      card.appendChild(canvas);

      const skip = document.createElement('a');
      skip.href = '#';
      skip.textContent = 'Показать содержимое →';
      Object.assign(skip.style, {
        position: 'absolute',
        bottom: '14px', left: '50%',
        transform: 'translateX(-50%)',
        color: 'rgba(255,255,255,.55)',
        fontSize: '11px',
        textDecoration: 'none',
        zIndex: '15',
        cursor: 'pointer',
        textShadow: '0 1px 2px rgba(0,0,0,.5)'
      });
      card.appendChild(skip);

      let revealed = false;
      const revealAll = () => {
        if (revealed) return;
        revealed = true;
        canvas.style.transition = 'opacity .5s';
        canvas.style.opacity = '0';
        skip.style.transition = 'opacity .3s';
        skip.style.opacity = '0';
        setTimeout(() => { canvas.remove(); skip.remove(); }, 520);
      };
      skip.onclick = (e) => { e.preventDefault(); revealAll(); };

      (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => {
        requestAnimationFrame(() => {
          const rect = card.getBoundingClientRect();
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          canvas.width = Math.round(rect.width * dpr);
          canvas.height = Math.round(rect.height * dpr);
          const ctx = canvas.getContext('2d');
          ctx.scale(dpr, dpr);

          ctx.fillStyle = color;
          ctx.fillRect(0, 0, rect.width, rect.height);

          for (let i = 0; i < 100; i++) {
            ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.22})`;
            ctx.beginPath();
            ctx.arc(Math.random() * rect.width, Math.random() * rect.height, Math.random() * 1.8 + 0.3, 0, Math.PI * 2);
            ctx.fill();
          }

          const fontSize = text.length > 20 ? 22 : text.length > 12 ? 26 : 32;
          ctx.fillStyle = 'rgba(255,255,255,0.96)';
          ctx.font = `bold ${fontSize}px "Cormorant Garamond", Georgia, serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.shadowColor = 'rgba(0,0,0,0.35)';
          ctx.shadowBlur = 4;
          ctx.fillText(text, rect.width / 2, rect.height / 2);

          ctx.font = '600 13px Inter, sans-serif';
          ctx.fillStyle = 'rgba(255,255,255,0.7)';
          ctx.shadowBlur = 2;
          ctx.fillText('👆 Проведи пальцем или мышью', rect.width / 2, rect.height / 2 + 42);
          ctx.shadowBlur = 0;

          let isDrawing = false;
          let lastX = null, lastY = null;
          let moveCount = 0;

          const getPos = (e) => {
            const r = canvas.getBoundingClientRect();
            return { x: e.clientX - r.left, y: e.clientY - r.top };
          };

          const scratch = (x, y) => {
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(x, y, 22, 0, Math.PI * 2);
            ctx.fill();
            if (lastX !== null && lastY !== null) {
              ctx.beginPath();
              ctx.lineWidth = 44;
              ctx.lineCap = 'round';
              ctx.lineJoin = 'round';
              ctx.moveTo(lastX, lastY);
              ctx.lineTo(x, y);
              ctx.stroke();
            }
            ctx.globalCompositeOperation = 'source-over';
            lastX = x; lastY = y;
          };

          const checkProgress = () => {
            try {
              const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
              let transparent = 0, total = 0;
              for (let i = 3; i < data.length; i += 4 * 20) {
                total++;
                if (data[i] < 128) transparent++;
              }
              if (total > 0 && transparent / total > 0.45) {
                revealAll();
                return true;
              }
            } catch (err) { /* ignore */ }
            return false;
          };

          canvas.addEventListener('pointerdown', (e) => {
            isDrawing = true;
            lastX = null; lastY = null;
            const { x, y } = getPos(e);
            scratch(x, y);
            try { canvas.setPointerCapture(e.pointerId); } catch {}
            e.preventDefault();
          });

          canvas.addEventListener('pointermove', (e) => {
            if (!isDrawing || revealed) return;
            const { x, y } = getPos(e);
            scratch(x, y);
            if (++moveCount % 15 === 0) {
              if (checkProgress()) isDrawing = false;
            }
            e.preventDefault();
          });

          canvas.addEventListener('pointerup', (e) => {
            if (isDrawing) { isDrawing = false; checkProgress(); }
            lastX = null; lastY = null;
          });

          canvas.addEventListener('pointercancel', () => {
            isDrawing = false;
            lastX = null; lastY = null;
          });
        });
      });
    }

      }

      let homeActsHtml = '';
      if (homeActsStr) {
          const acts = homeActsStr.split(',');
          const actsList = acts.map(a => {
             const icon = homeActsIcons[a] || '';
             return `${icon} ${esc(a)}`;
          }).join(' • ');
          homeActsHtml = `<p style="text-align:center;margin:8px 0"><b>Чем займёмся:</b> ${actsList}</p>`;
      }

      const dateTimeHtml = [];
      if (date) dateTimeHtml.push(`<b>Дата:</b> ${esc(date)}`);
      if (time) dateTimeHtml.push(`<b>Время:</b> ${esc(time)}`);

      app.innerHTML = `
        <div class="centered-view">
          <section class="card">
            <div style="width: 120px; height: 120px; margin: -10px auto 10px;">
              ${stickerSvg}
            </div>
            <p class="hint">${esc(from)} приглашает ${esc(to)}</p>
            <h1>${esc(q)}</h1>
            ${dateTimeHtml.length ? `<p style="text-align:center;margin:8px 0">${dateTimeHtml.join(' • ')}</p>` : ''}
            ${placeHtml}
            ${foodHtml}
            ${homeActsHtml}
            ${msg   ? `<p class="msg" style="margin-top:18px">${esc(msg)}</p>` : ''}
            
            <div class="actions" style="position:relative;">
              <button id="yes">Да</button>
              <button id="no" class="secondary">Нет</button>
            </div>
            <div id="answer"></div>
          </section>
        </div>`;

      const yesBtn = document.getElementById('yes');
      const noBtn = document.getElementById('no');
      const cardBody = document.querySelector('.card');

      yesBtn.onclick = () => {
        const anim = animYes;
        let delay = 0;
        
        if (anim === 'shake') {
          yesBtn.style.pointerEvents = 'none';
          yesBtn.style.animation = 'shakeEffect 0.5s ease-in-out';
          delay = 1000;
          setTimeout(() => {
            yesBtn.style.animation = 'explodeEffect 0.5s forwards';
          }, 500);
        } else if (anim === 'kiss') {
          yesBtn.style.pointerEvents = 'none';
          delay = 400;
          const kiss = document.createElement('div');
          kiss.textContent = '💋';
          kiss.style.cssText = `
            position: absolute;
            left: 25%; top: 50%;
            font-size: 24px;
            pointer-events: none;
            animation: floatKiss 0.8s ease-out forwards;
            z-index: 10;
          `;
          yesBtn.parentElement.appendChild(kiss);
        }

        // После ответа "Да" получатель выбирает место, занятия и еду
        setTimeout(() => {
          const sTitle = params.get('successTitle') || 'Рад что не отказалась.';
          let sDesc = params.get('successDesc') || 'Будь готова к {date} в {time}, я приеду за тобой.';
          
          // Заменяем дату и время
          sDesc = sDesc.replace(/{date}/g, date || 'назначенному дню')
                       .replace(/{time}/g, time || 'назначенному времени');

          const rActIcons = {
            'Прогулка': '🚶', 'Кино': '🎬', 'Ужин со свечами': '🕯️', 'Киновечер': '🍿',
            'Настольные игры': '🎲', 'Игры на приставке': '🎮', 'Караоке': '🎤',
            'Приготовить коктейли': '🍹', 'Массаж при свечах': '💆', 'Вечер без гаджетов': '📵'
          };
          const rPlaceOptions = [
            { val: 'Бильярд', icon: placeIcons['Бильярд'] || '' },
            { val: 'Ресторан', icon: placeIcons['Ресторан'] || '' },
            { val: 'Боулинг', icon: placeIcons['Боулинг'] || '' },
            { val: 'Свидание дома', icon: placeIcons['Свидание дома'] || '' }
          ];
          const rActOptions = Object.keys(rActIcons).map(val => ({ val, icon: rActIcons[val] }));
          const rFoodOptions = Object.keys(foodIcons).map(val => ({ val, icon: foodIcons[val] }));

          let rPlace = '';
          let rActs = [];
          let rFoods = [];

          const optHtml = (opts) => opts.map(o =>
            '<div class="choice-btn" data-val="' + esc(o.val) + '"><span class="icon">' + o.icon + '</span>' + esc(o.val) + '</div>'
          ).join('');

          cardBody.innerHTML = `
            <div>
              <h1 style="margin-bottom: 6px; text-align:center;">${esc(sTitle)}</h1>
              <p class="msg" style="font-size: 16px; text-align:center;">${esc(sDesc)}</p>
              <p class="step-title" style="margin-top:22px">Теперь выбери, как проведём свидание</p>

              <label style="margin-top:0">Куда пойдём?</label>
              <div class="choice-grid" id="rPlaceGrid">${optHtml(rPlaceOptions)}</div>

              <label>Что будем делать? (можно выбрать несколько)</label>
              <div class="choice-grid" id="rActsGrid">${optHtml(rActOptions)}</div>

              <label>Что покушаем? (можно выбрать несколько)</label>
              <div class="choice-grid" id="rFoodGrid">${optHtml(rFoodOptions)}</div>

              <div class="actions">
                <button id="choiceDone" type="button">Готово 💞</button>
              </div>
            </div>
          `;

          const bindGrid = (gridId, isMulti) => {
            document.querySelectorAll('#' + gridId + ' .choice-btn').forEach(btn => {
              btn.onclick = () => {
                const val = btn.dataset.val;
                if (isMulti) {
                  const arr = gridId === 'rActsGrid' ? rActs : rFoods;
                  const idx = arr.indexOf(val);
                  if (idx === -1) { arr.push(val); btn.classList.add('active'); }
                  else { arr.splice(idx, 1); btn.classList.remove('active'); }
                } else {
                  rPlace = val;
                  document.querySelectorAll('#rPlaceGrid .choice-btn').forEach(b => b.classList.remove('active'));
                  btn.classList.add('active');
                }
              };
            });
          };
          bindGrid('rPlaceGrid', false);
          bindGrid('rActsGrid', true);
          bindGrid('rFoodGrid', true);

          document.getElementById('choiceDone').onclick = () => {
            if (!rPlace) { alert('Сначала выбери, куда пойдём 🙂'); return; }
            const fmtLine = (arr, icons, label) => arr.length
              ? '<p style="text-align:center;margin:8px 0"><b>' + label + ':</b> ' + arr.map(x => (icons[x] || '') + ' ' + esc(x)).join(' • ') + '</p>'
              : '';
            cardBody.innerHTML = `
              <div style="text-align:center; padding: 20px 0;">
                <h1 style="margin-bottom: 20px;">${esc(sTitle)}</h1>
                <p class="msg" style="font-size: 16px;">${esc(sDesc)}</p>
                ${fmtLine([rPlace], placeIcons, 'Куда пойдём')}
                ${fmtLine(rFoods, foodIcons, 'Что покушаем')}
                ${fmtLine(rActs, rActIcons, 'Что будем делать')}
                <div class="answer" style="margin-top: 30px;">
                  <p class="small">Отправь этот ответ отправителю, чтобы он всё знал.</p>
                  <button id="share" type="button" style="margin-top: 10px;">Поделиться ответом</button>
                </div>
              </div>
            `;
            document.getElementById('share').onclick = () => {
              const parts = ['Куда пойдём: ' + rPlace];
              if (rFoods.length) parts.push('Что покушаем: ' + rFoods.join(', '));
              if (rActs.length) parts.push('Что будем делать: ' + rActs.join(', '));
              const shareText = 'Мой ответ на приглашение: Да!\n' + parts.join(' • ') + '\n' + location.href;
              if (navigator.share) navigator.share({ text: shareText });
              else navigator.clipboard.writeText(shareText)
                .then(() => alert('Ответ скопирован. Отправь его отправителю.'));
            };
          };
        }, delay);
      };

      noBtn.onclick = () => {
        const anim = animNo;
        let delay = 0;
        
        if (anim === 'shrink') {
          noBtn.style.pointerEvents = 'none';
          noBtn.style.animation = 'shrinkEffect 0.5s ease-in-out';
          delay = 1000;
        }

        // Показываем кастомный текст при клике на "Нет"
        setTimeout(() => {
          const fTitle = params.get('failTitle') || 'Очень жаль.';
          const fDesc = params.get('failDesc') || 'Может, в другой раз?';

          cardBody.innerHTML = `
            <div style="text-align:center; padding: 20px 0;">
              <h1 style="margin-bottom: 20px;">${esc(fTitle)}</h1>
              <p class="msg" style="font-size: 16px;">${esc(fDesc)}</p>
              
              <div class="answer" style="margin-top: 30px;">
                <p class="small">Ты можешь отправить свой ответ отправителю.</p>
                <button id="share" type="button" style="margin-top: 10px;">Поделиться ответом</button>
              </div>
            </div>
          `;
          
          document.getElementById('share').onclick = () => {
            const shareText = `Мой ответ на приглашение: Нет\n${location.href}`;
            if (navigator.share) navigator.share({ text: shareText });
            else navigator.clipboard.writeText(shareText)
              .then(() => alert('Ответ скопирован. Отправь его отправителю.'));
          };
        }, delay);
      };
    }

    /* ====== РОУТИНГ ====== */
    function navigate(view) {
      if (view === 'landing') renderLanding();
      else if (view === 'create') { state.step = 0; state.data = {}; renderCreate(); }
    }

    document.addEventListener('click', (e) => {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      e.preventDefault();
      if (el.dataset.action === 'create') navigate('create');
      if (el.dataset.action === 'home') navigate('landing');
    });

    // ПРОВЕРКА НА ВОЗВРАТ С ОПЛАТЫ
    if (params.get('paid') === 'true') {
      let saved = null;
      try { saved = localStorage.getItem('pending_payment') || sessionStorage.getItem('pending_payment'); } catch(e) {}
      
      if (saved) {
        state.data = JSON.parse(saved);
        try { localStorage.removeItem('pending_payment'); sessionStorage.removeItem('pending_payment'); } catch(e) {}
        
        document.body.classList.remove('landing-mode');
        app.innerHTML = `
          <div class="centered-view">
            <section class="card">
              <div class="progress" id="progress"></div>
              <div id="stepBody"></div>
            </section>
          </div>
        `;
        state.step = steps.length - 1;
        drawProgress();
        showResult();
      } else {
        // Если данных нет, просто сбрасываем параметр
        window.history.replaceState({}, document.title, location.pathname);
        renderLanding();
      }
    } else if (params.has('to')) {
      if (params.has('k')) renderUnlock();
      else if (params.has('sc')) renderScratch();
      else if (params.has('env')) renderEnvelope();
      else renderInvite();
    } else {
      // Если пользователь вернулся вручную без ?paid=true, но в памяти есть данные
      let saved = null;
      try { saved = localStorage.getItem('pending_payment'); } catch(e) {}
      if (saved) {
        // Спрашиваем, оплатил ли он
        if (confirm('Похоже, вы вернулись с оплаты. Вы успешно оплатили?')) {
          state.data = JSON.parse(saved);
          try { localStorage.removeItem('pending_payment'); sessionStorage.removeItem('pending_payment'); } catch(e) {}
          
          document.body.classList.remove('landing-mode');
          app.innerHTML = `
            <div class="centered-view">
              <section class="card">
                <div class="progress" id="progress"></div>
                <div id="stepBody"></div>
              </section>
            </div>
          `;
          state.step = steps.length - 1;
          drawProgress();
          showResult();
        } else {
          renderLanding();
        }
      } else {
        renderLanding();
      }
    }
  </script>
</body>
</html>
